<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turtle Merge Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
      background: linear-gradient(135deg, #7cb342 0%, #9ccc65 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      font-size: 2.5em;
    }
    #game-container {
      position: relative;
      background: #2e7d32;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 10px;
    }
    canvas {
      display: block;
      border-radius: 5px;
      background: #e8f5e9;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 15px;
      border-radius: 10px;
      min-width: 150px;
    }
    #score {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 10px;
    }
    #next-ball {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #next-ball img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #fff;
    }
    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      display: none;
      z-index: 20;
      border: 3px solid #ff6b6b;
    }
    #game-over h2 {
      color: #ff6b6b;
      margin-bottom: 15px;
      font-size: 2em;
    }
    #final-score {
      font-size: 1.5em;
      margin-bottom: 20px;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.1em;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #45a049;
    }
    #instructions {
      margin-top: 15px;
      text-align: center;
      max-width: 500px;
      font-size: 0.9em;
      opacity: 0.9;
    }


    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #555555;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s ease;
    }
    #loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }
    #logo {
      width: 340px;
      max-width: 80vw;
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.45));
      animation: float 2s ease-in-out infinite;
    }
    .loading-text {
      position: absolute;
      bottom: 80px;
      color: white;
      font-size: 1.4em;
      letter-spacing: 1px;
    }
    .dots::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <img id="logo" alt="Turtle Games">
    <div class="loading-text">Loading<span class="dots"></span></div>
  </div>

  <h1>🐢 Turtle Merge 🐢</h1>
  <div id="game-container">
    <div id="ui">
      <div id="score">Score: 0</div>
      <div id="next-ball">
        Next: <img id="next-img" alt="next">
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="game-over">
      <h2>Game Over!</h2>
      <div id="final-score">Score: 0</div>
      <button onclick="restartGame()">Play Again</button>
    </div>
  </div>
  <div id="instructions">
    Move mouse to aim the angle • Click to launch a marble • Merge same turtles to evolve them! • Don't let the container overflow!
  </div>
  </div>

    const CONTAINER_LEFT = 100;
    const CONTAINER_RIGHT = 500;
    const CONTAINER_BOTTOM = 650;
    const CONTAINER_TOP = 150;
    const WALL_THICKNESS = 20;
    const DROP_Y = 80;
    const DANGER_Y = CONTAINER_TOP + 30;

    // Levels definition
    const levels = [
      { radius: 28, image: IMAGE_DATA['u1f344_u1f422.png'], points: 2, name: 'Mushroom', color: '#f4a261', rim: '#e76f51' },
      { radius: 36, image: IMAGE_DATA['u1fab5_u1f422.png'], points: 4, name: 'Wood', color: '#d4a373', rim: '#8d6e63' },
      { radius: 44, image: IMAGE_DATA['u1f338_u1f422.png'], points: 8, name: 'Blossom', color: '#ff9ec7', rim: '#e83e8c' },
      { radius: 52, image: IMAGE_DATA['u1f30c_u1f422.png'], points: 12, name: 'Galaxy', color: '#9b5de5', rim: '#5a189a' },
      { radius: 60, image: IMAGE_DATA['u1f41d_u1f422.png'], points: 18, name: 'Bee', color: '#ffd60a', rim: '#f48c06' },
      { radius: 68, image: IMAGE_DATA['u1f422_u1f308.png'], points: 26, name: 'Rainbow', color: '#b5e48c', rim: '#52b788' },
      { radius: 76, image: IMAGE_DATA['u1f422_u1f525.png'], points: 36, name: 'Fire', color: '#ffd166', rim: '#ef476f' },
      { radius: 84, image: IMAGE_DATA['u1f621_u1f422.png'], points: 50, name: 'Angry', color: '#ff6b6b', rim: '#c1121f' },
      { radius: 92, image: IMAGE_DATA['u1f31e_u1f422.png'], points: 70, name: 'Sun', color: '#ffe066', rim: '#f4a261' },
      { radius: 102, image: IMAGE_DATA['emoji.svg'], points: 100, name: 'Legendary', color: '#a8e6cf', rim: '#2d6a4f' }
    ];

    // Preload images
    const loadedImages = {};
    levels.forEach((lvl, idx) => {
      loadedImages[idx] = new Image();
      loadedImages[idx].src = lvl.image;
    });

    let nextLevel = 0; // will be randomized
    let audioCtx = null;

    function playMergeSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e) {}
    }

    function pickNextLevel() {
      // 65% chance level 1 (index 0), 35% chance level 2 (index 1)
      nextLevel = Math.random() < 0.65 ? 0 : 1;
      document.getElementById('next-img').src = levels[nextLevel].image;
    }

    let engine, render, runner;
    let score = 0;
    let gameOver = false;
    let canDrop = true;
    let currentAimAngle = Math.PI / 2; // straight down
    const LAUNCH_SPEED = 8;
    const FIXED_X = (CONTAINER_LEFT + CONTAINER_RIGHT) / 2;
    let balls = [];

    function initGame() {
      // Clean up previous
      if (engine) {
        Engine.clear(engine);
        if (render) Render.stop(render);
        if (runner) Runner.stop(runner);
      }

      engine = Engine.create();
      engine.gravity.y = 0.18;
      const world = engine.world;

      const canvas = document.getElementById('gameCanvas');
      canvas.width = CANVAS_WIDTH;
      canvas.height = CANVAS_HEIGHT;

      render = Render.create({
        canvas: canvas,
        engine: engine,
        options: {
          width: CANVAS_WIDTH,
          height: CANVAS_HEIGHT,
          wireframes: false,
          background: '#e8f5e9',
          showAngleIndicator: false
        }
      });

      // Walls
      const walls = [
        // Left wall
        Bodies.rectangle(CONTAINER_LEFT - WALL_THICKNESS / 2, (CONTAINER_TOP + CONTAINER_BOTTOM) / 2, WALL_THICKNESS, CONTAINER_BOTTOM - CONTAINER_TOP + 40, {
          isStatic: true,
          render: { fillStyle: '#2e7d32' },
          label: 'wall'
        }),
        // Right wall
        Bodies.rectangle(CONTAINER_RIGHT + WALL_THICKNESS / 2, (CONTAINER_TOP + CONTAINER_BOTTOM) / 2, WALL_THICKNESS, CONTAINER_BOTTOM - CONTAINER_TOP + 40, {
          isStatic: true,
          render: { fillStyle: '#2e7d32' },
          label: 'wall'
        }),
        // Bottom
        Bodies.rectangle((CONTAINER_LEFT + CONTAINER_RIGHT) / 2, CONTAINER_BOTTOM + WALL_THICKNESS / 2, CONTAINER_RIGHT - CONTAINER_LEFT + WALL_THICKNESS * 2, WALL_THICKNESS, {
          isStatic: true,
          render: { fillStyle: '#1b5e20' },
          label: 'wall'
        })
      ];
      Composite.add(world, walls);

      // Danger line visual (drawn in afterRender)
      runner = Runner.create();
      Runner.run(runner, engine);
      Render.run(render);

      score = 0;
      gameOver = false;
      canDrop = true;
      balls = [];
      pickNextLevel();
      updateScore();
      document.getElementById('game-over').style.display = 'none';

      setupEvents();
    }

    function createBall(x, y, levelIndex) {
      const level = levels[levelIndex];
      const ball = Bodies.circle(x, y, level.radius, {
        restitution: 0.85,
        friction: 0.02,
        frictionAir: 0.008,
        density: 0.0015,
        label: 'ball',
        level: levelIndex,
        render: {
          fillStyle: 'transparent',
          strokeStyle: 'transparent',
          lineWidth: 0
        }
      });
      ball.level = levelIndex;
      ball.isMerging = false;
      ball.dangerTime = 0;
      return ball;
    }

    function dropBall() {
      if (!canDrop || gameOver) return;
      const levelIndex = nextLevel;
      const r = levels[levelIndex].radius;
      const ball = createBall(FIXED_X, DROP_Y, levelIndex);
      // Launch with angle
      const vx = Math.cos(currentAimAngle) * LAUNCH_SPEED;
      const vy = Math.sin(currentAimAngle) * LAUNCH_SPEED;
      Body.setVelocity(ball, { x: vx, y: vy });
      Composite.add(engine.world, ball);
      balls.push(ball);
      canDrop = false;
      // Pick the next one immediately so preview updates
      pickNextLevel();
      setTimeout(() => { canDrop = true; }, 500);
    }

    function mergeBalls(a, b) {
      if (a.isMerging || b.isMerging || a.level !== b.level || a.level >= levels.length - 1) return;
      a.isMerging = true;
      b.isMerging = true;

      const newLevel = a.level + 1;
      const newX = (a.position.x + b.position.x) / 2;
      const newY = (a.position.y + b.position.y) / 2;

      Composite.remove(engine.world, [a, b]);
      balls = balls.filter(ball => ball !== a && ball !== b);

      const newBall = createBall(newX, newY, newLevel);
      // Small upward pop
      Body.setVelocity(newBall, { x: 0, y: -2 });
      Composite.add(engine.world, newBall);
      balls.push(newBall);

      score += levels[newLevel].points;
      updateScore();
      playMergeSound();

      // Visual feedback - could add particles here
    }

    function checkGameOver() {
      if (gameOver) return;
      for (let ball of balls) {
        if (ball.position.y < DANGER_Y && Math.abs(ball.velocity.y) < 0.5 && Math.abs(ball.velocity.x) < 0.5) {
          ball.dangerTime += 1;
          if (ball.dangerTime > 90) { // ~1.5 seconds
            endGame();
            return;
          }
        } else {
          ball.dangerTime = 0;
        }
      }
    }

    function endGame() {
      gameOver = true;
      document.getElementById('final-score').textContent = 'Score: ' + score;
      document.getElementById('game-over').style.display = 'block';
    }

    function updateScore() {
      document.getElementById('score').textContent = 'Score: ' + score;
    }

    function setupEvents() {
      // Collision for merging
      Events.on(engine, 'collisionStart', (event) => {
        if (gameOver) return;
        for (let pair of event.pairs) {
          const { bodyA, bodyB } = pair;
          if (bodyA.label === 'ball' && bodyB.label === 'ball') {
            if (bodyA.level === bodyB.level && !bodyA.isMerging && !bodyB.isMerging) {
              mergeBalls(bodyA, bodyB);
            }
          }
        }
      });

      // Game over check
      Events.on(engine, 'afterUpdate', () => {
        checkGameOver();
      });

      // Custom drawing for trajectory, marbles, and danger line
      Events.on(render, 'afterRender', () => {
        const ctx = render.context;

        // Draw all balls as simple colored circles with darker outlines
        for (let ball of balls) {
          if (!ball.position) continue;
          const x = ball.position.x;
          const y = ball.position.y;
          const lvl = levels[ball.level];
          const r = ball.circleRadius || lvl.radius;
          const img = loadedImages[ball.level];
          const col = lvl.color || '#ffffff';
          const rim = lvl.rim || '#333';

          ctx.save();

          // Solid colored circle
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = col;
          ctx.fill();

          // Darker outline
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.strokeStyle = rim;
          ctx.lineWidth = 4;
          ctx.stroke();

          // Turtle image clipped inside
          if (img && img.complete) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, r * 0.75, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(img, x - r * 0.75, y - r * 0.75, r * 1.5, r * 1.5);
            ctx.restore();
          }

          ctx.restore();
        }

        // Danger line
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = 'rgba(255, 80, 80, 0.6)';
        ctx.lineWidth = 2;
        ctx.moveTo(CONTAINER_LEFT, DANGER_Y);
        ctx.lineTo(CONTAINER_RIGHT, DANGER_Y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Trajectory + aiming marble
        if (!gameOver && canDrop) {
          const r = levels[nextLevel].radius;
          const len = 180;
          const endX = FIXED_X + Math.cos(currentAimAngle) * len;
          const endY = DROP_Y + Math.sin(currentAimAngle) * len;

          // Trajectory as grey circles
          const steps = 10;
          for (let i = 1; i <= steps; i++) {
            const t = i / steps;
            const cx = FIXED_X + (endX - FIXED_X) * t;
            const cy = DROP_Y + (endY - DROP_Y) * t;
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#888888';
            ctx.fill();
            ctx.strokeStyle = '#555555';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          // Aiming marble preview
          const img = loadedImages[nextLevel];
          const lvlNext = levels[nextLevel];
          ctx.save();

          // Solid colored circle
          ctx.beginPath();
          ctx.arc(FIXED_X, DROP_Y, r, 0, Math.PI * 2);
          ctx.fillStyle = lvlNext.color;
          ctx.fill();

          // Darker outline
          ctx.beginPath();
          ctx.arc(FIXED_X, DROP_Y, r, 0, Math.PI * 2);
          ctx.strokeStyle = lvlNext.rim;
          ctx.lineWidth = 4;
          ctx.stroke();

          if (img && img.complete) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(FIXED_X, DROP_Y, r * 0.75, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(img, FIXED_X - r * 0.75, DROP_Y - r * 0.75, r * 1.5, r * 1.5);
            ctx.restore();
          }

          ctx.restore();
        }
      });
    }

    // Mouse aiming (controls angle)
    document.getElementById('gameCanvas').addEventListener('mousemove', (e) => {
      const rect = e.target.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      currentAimAngle = Math.atan2(my - DROP_Y, mx - FIXED_X);
      // Limit to downward angles
      if (currentAimAngle < 0.2) currentAimAngle = 0.2;
      if (currentAimAngle > Math.PI - 0.2) currentAimAngle = Math.PI - 0.2;
    });

    document.getElementById('gameCanvas').addEventListener('click', (e) => {
      if (!gameOver) dropBall();
    });

    // Touch support
    document.getElementById('gameCanvas').addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = e.target.getBoundingClientRect();
      const touch = e.touches[0];
      const mx = touch.clientX - rect.left;
      const my = touch.clientY - rect.top;
      currentAimAngle = Math.atan2(my - DROP_Y, mx - FIXED_X);
      if (currentAimAngle < 0.2) currentAimAngle = 0.2;
      if (currentAimAngle > Math.PI - 0.2) currentAimAngle = Math.PI - 0.2;
    }, { passive: false });

    document.getElementById('gameCanvas').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!gameOver) dropBall();
    }, { passive: false });

    function restartGame() {
      initGame();
    }

    // Start the game
    window.onload = function() {
      document.getElementById('logo').src = LOGO_DATA;
      const music = new Audio(MUSIC_DATA);
      music.loop = true;
      music.volume = 0.5;

      // Start music on first user interaction (browsers block autoplay)
      let musicStarted = false;
      function startMusic() {
        if (musicStarted) return;
        musicStarted = true;
        music.play().catch(() => {});
      }
      document.addEventListener('click', startMusic);
      document.addEventListener('touchstart', startMusic);

      // Auto-start game after short loading display
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('hide');
        setTimeout(() => {
          document.getElementById('loading-screen').style.display = 'none';
          initGame();
        }, 800);
      }, 2000);
    };
  </script>
</body>
